name: Déploiement

# Déploie sur le serveur à chaque fusion dans main, ou à la demande (Actions > Déploiement > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : liste les changements (dont les suppressions) sans rien modifier"
        type: boolean
        default: true

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe PHP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass rsync
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Déployer par SSH (rsync)
        env:
          SSHPASS: ${{ secrets.EC_SSH_PASS }}
          HOST: ${{ secrets.EC_SSH_HOST }}
          USER_SSH: ${{ secrets.EC_SSH_USER }}
          DIR: ${{ secrets.EC_SSH_DIR }}
        run: |
          case "$DIR" in ""|"/"|"."|"~"|"/home"|"/home/") echo "EC_SSH_DIR invalide : $DIR"; exit 1;; esac
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; echo "SIMULATION : rien n'est modifié"; fi
          # --delete : le dossier du serveur devient le miroir exact du dépôt (les fichiers retirés du dépôt sont supprimés).
          # Les fichiers exclus ci-dessous sont protégés de la suppression (pas de --delete-excluded) :
          # config.php (secrets) et data/*.php (données d'exécution) restent sur le serveur.
          sshpass -e rsync -rlptz --delete --itemize-changes $DRY \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
            --exclude='/config.php' --exclude='/data/*.php' \
            --exclude='/config.example.php' --exclude='/CLAUDE.md' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./ "$USER_SSH@$HOST:$DIR/"
