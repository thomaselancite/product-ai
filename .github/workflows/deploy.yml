name: Déploiement

# Envoie le code sur l'hébergement OVH en SFTP (lftp), comme le dépôt creation-site-web.
# - push sur main : déploiement réel
# - lancement manuel (Actions > Déploiement > Run workflow) : simulation par défaut
# Le dossier distant devient le miroir du dépôt (les fichiers retirés du dépôt sont supprimés),
# sauf config.php et data/*.php, qui restent sur le serveur et ne sont jamais envoyés ni supprimés.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : liste les changements (dont les suppressions) sans rien modifier"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC_SSH_HOST: ${{ secrets.EC_SSH_HOST }}
      EC_SSH_PORT: ${{ secrets.EC_SSH_PORT }}
      EC_SSH_USER: ${{ secrets.EC_SSH_USER }}
      LFTP_PASSWORD: ${{ secrets.EC_SSH_PASS }}
      REMOTE_DIR: ${{ secrets.EC_SSH_DIR }}
    steps:
      - name: Vérifier la configuration
        run: |
          ok=true
          for v in EC_SSH_HOST EC_SSH_USER LFTP_PASSWORD REMOTE_DIR; do
            [ -n "${!v}" ] || { echo "::error::Secret manquant : $v"; ok=false; }
          done
          $ok
          case "$EC_SSH_HOST" in *" "*|*"://"*|*"/"*) echo "::error::EC_SSH_HOST doit être un nom de serveur seul (sans sftp://, sans espace, sans /)"; exit 1;; esac
          case "$REMOTE_DIR" in
            "/"|"."|"./"|"~"|"~/"|"/home"|"/home/"|*".."*)
              echo "::error::Dossier distant refusé. Indiquez le dossier de l'outil (onglet « Mes sites » OVH)."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Installer lftp et php
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp php-cli

      - name: Vérifier la syntaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Vérifier le dossier distant
        run: |
          PORT="${EC_SSH_PORT:-22}"
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30;
            open --env-password -u \"$EC_SSH_USER\" -p $PORT sftp://$EC_SSH_HOST;
            cd \"$REMOTE_DIR\" && cls -1a > /tmp/distant.txt; bye" \
            || { echo "::error::Connexion refusée ou dossier distant introuvable (le dossier n'est jamais créé automatiquement)"; exit 1; }
          n=$(grep -cvE '^\.{1,2}/?$' /tmp/distant.txt || true)
          echo "Dossier distant trouvé : $n élément(s)"

      - name: Simuler
        run: |
          PORT="${EC_SSH_PORT:-22}"
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30;
            open --env-password -u \"$EC_SSH_USER\" -p $PORT sftp://$EC_SSH_HOST;
            mirror --reverse --delete --verbose --dry-run \
              --exclude '^\.git/' --exclude '^\.github/' --exclude '^\.gitignore$' \
              --exclude '^config\.php$' --exclude '^config\.example\.php$' --exclude '^data/.*\.php$' \
              --exclude '^CLAUDE\.md$' --exclude '^README\.md$' \
              ./ \"$REMOTE_DIR\"; bye" | tee /tmp/simulation.txt
          # Sécurité : si la simulation supprimait config.php ou un fichier de données, on s'arrête.
          if grep -E '^rm ' /tmp/simulation.txt | grep -E '(^|/)config\.php$|/data/[^ ]*\.php$'; then
            echo "::error::La simulation supprimerait config.php ou data/*.php : arrêt."; exit 1
          fi
          del=$(grep -cE '^rm ' /tmp/simulation.txt || true)
          echo "Suppressions prévues : $del"
          echo "Suppressions prévues : $del" >> "$GITHUB_STEP_SUMMARY"

      - name: Déployer
        if: github.event_name == 'push' || inputs.dry_run != true
        run: |
          PORT="${EC_SSH_PORT:-22}"
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30;
            open --env-password -u \"$EC_SSH_USER\" -p $PORT sftp://$EC_SSH_HOST;
            mirror --reverse --delete --verbose \
              --exclude '^\.git/' --exclude '^\.github/' --exclude '^\.gitignore$' \
              --exclude '^config\.php$' --exclude '^config\.example\.php$' --exclude '^data/.*\.php$' \
              --exclude '^CLAUDE\.md$' --exclude '^README\.md$' \
              ./ \"$REMOTE_DIR\"; bye"
